<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b2735"/>
      <stop offset="1" stop-color="#0d1620"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4183C4"/>
      <stop offset="0.5" stop-color="#17a2b8"/>
      <stop offset="1" stop-color="#28a745"/>
    </linearGradient>
  </defs>

  <!-- Fundo -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Barra de destaque superior -->
  <rect x="0" y="0" width="1200" height="10" fill="url(#accent)"/>

  <!-- Nome do site -->
  <text x="80" y="250" font-family="Helvetica, Arial, sans-serif" font-size="96" font-weight="700" fill="#ffffff">Alberto Ivo</text>

  <!-- Descrição -->
  <text x="82" y="320" font-family="Helvetica, Arial, sans-serif" font-size="36" font-weight="400" fill="#c5d1dc">Traveler, Full Stack Developer, Triathlete</text>

  <!-- Linha divisória -->
  <rect x="82" y="360" width="120" height="5" rx="2.5" fill="url(#accent)"/>

  <!-- Badges de categorias (mesma paleta do site) -->
  <g font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#ffffff">
    <g transform="translate(82,420)">
      <rect width="130" height="52" rx="8" fill="#007bff"/>
      <text x="65" y="35" text-anchor="middle">Fotografia</text>
    </g>
    <g transform="translate(228,420)">
      <rect width="78" height="52" rx="8" fill="#dc3545"/>
      <text x="39" y="35" text-anchor="middle">Dev</text>
    </g>
    <g transform="translate(324,420)">
      <rect width="238" height="52" rx="8" fill="#ffc107"/>
      <text x="119" y="35" text-anchor="middle" fill="#1b2735">Bolsa de Valores</text>
    </g>
    <g transform="translate(578,420)">
      <rect width="168" height="52" rx="8" fill="#28a745"/>
      <text x="84" y="35" text-anchor="middle">Estatística</text>
    </g>
    <g transform="translate(762,420)">
      <rect width="120" height="52" rx="8" fill="#17a2b8"/>
      <text x="60" y="35" text-anchor="middle">Fitness</text>
    </g>
  </g>

  <!-- URL do site -->
  <text x="82" y="560" font-family="Helvetica, Arial, sans-serif" font-size="30" font-weight="400" fill="#7d8fa0">albertoivo.github.io</text>
</svg>
