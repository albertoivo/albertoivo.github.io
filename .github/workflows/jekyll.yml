# Build e deploy do site Jekyll para o GitHub Pages via GitHub Actions.
# Necessário porque o site usa plugins custom em _plugins/ e o gem
# jekyll-last-modified-at, que o build nativo do GitHub Pages (modo --safe)
# NÃO executa. Com Actions, o build roda com o Bundler completo do projeto.
name: Build e Deploy Jekyll

on:
  push:
    branches: [master]
  # Permite disparar manualmente pela aba Actions
  workflow_dispatch:

# Permissões necessárias para publicar no GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Um deploy por vez; não cancela um deploy em andamento
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # jekyll-last-modified-at precisa do histórico completo do Git
          # para calcular a data de última modificação de cada arquivo.
          fetch-depth: 0

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true # instala gems e faz cache automaticamente

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build com Jekyll
        # baseurl vem do output do configure-pages (vazio para user pages)
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production

      - name: Upload do artefato
        uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy para o GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
