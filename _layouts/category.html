---
layout: default
---

<div class="posts">
  <h1>{{ page.title }}</h1>
    {% for post in site.categories[page.title] %}
      <article class="post">
        <h2><a href="{{ site.baseurl }}{{ post.url }}">{{ post.title }}</a></h2>
        <div class="entry">{{ post.excerpt }}</div>
      </article>
    {% endfor %}
</div>
